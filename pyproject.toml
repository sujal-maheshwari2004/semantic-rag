[project]
name = "semantic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.13.2",
    "nltk>=3.9.4",
    "numpy>=2.4.4",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "rich>=15.0.0",
    "sentence-transformers>=5.4.1",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "ruff>=0.15.12",
]


[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:importlib",
]